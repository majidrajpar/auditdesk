name: AuditDesk CI Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core Unit Tests
        run: |
          python -u tests/test_workbench.py

      - name: Run REST API Integration Suite
        run: |
          python -u tests/test_server_integration.py

      - name: Run Deep Debug & Corrupted Input Tests
        run: |
          python -u tests/test_deep_debug.py

      - name: Run Extreme Limits & Chaos Stress Tests
        run: |
          python -u tests/extreme_limit_tests.py
