name: Build Portable Zero-Install Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-portable-zip:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Standalone Zero-Install Portable ZIP
        run: |
          python build_portable_zip.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuditDesk-Portable-Windows-x64
          path: dist/AuditDesk-Portable-Windows-x64.zip

      - name: Release Asset (On Tagged Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AuditDesk-Portable-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
